name: Auto Translate Questions

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/questions/**'
  workflow_dispatch:
    inputs:
      language:
        description: 'Specific language to translate (optional, leave empty for all)'
        required: false
        default: ''

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetch current and previous commit for diff
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: npm install
      
      - name: Detect changed questions
        id: detect-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - translating all or specific language"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            # Check if any question files were changed
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep "^src/questions/" || true)
            if [ -n "$CHANGED_FILES" ]; then
              echo "Question files changed:"
              echo "$CHANGED_FILES"
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "No question files changed"
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Run translation
        if: steps.detect-changes.outputs.changed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.language }}" ]; then
            echo "Translating to specific language: ${{ github.event.inputs.language }}"
            npm run translate:${{ github.event.inputs.language }}
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - translating to all languages (full translation)"
            npm run translate:all
          else
            echo "Auto-translating changed content only (incremental)"
            node scripts/incremental-translate.js
          fi
      
      - name: Check for translation changes
        id: check-changes
        if: steps.detect-changes.outputs.changed == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.check-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: Update translations via Gemini AI'
          title: 'Auto-translated questions to all languages'
          body: |
            ## Automated Translation Update
            
            This PR contains automated translations generated by Google Gemini AI.
            
            ### Changes
            - Updated translations in `src/translations/` based on changes in `src/questions/`
            
            ### Review Notes
            - Please review the translations for accuracy and context
            - The translations are generated automatically but may need human review
            - Check that markdown formatting is preserved correctly
            
            Generated by the Auto Translate Questions workflow.
          branch: auto-translate-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            translations
